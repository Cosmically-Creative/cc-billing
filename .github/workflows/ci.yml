name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ccbilling
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ccbilling
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccbilling" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ccbilling
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: ccbilling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest -v
      - name: Sample database and media restore smoke
        env:
          PG_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python ops/restore_smoke.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cc-billing:ci .
      - run: docker run --rm -e DJANGO_DEBUG=1 --entrypoint python cc-billing:ci manage.py check
      - run: docker run --rm -e DJANGO_DEBUG=1 --entrypoint python cc-billing:ci manage.py pdf_smoke
