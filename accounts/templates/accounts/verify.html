{% extends "base.html" %}
{% block title %}Authenticator code{% endblock %}
{% block content %}
<h1>Authenticator code</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
  <label for="code">6-digit code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required autofocus>
  <button>Sign in</button>
</form>
{% endblock %}
